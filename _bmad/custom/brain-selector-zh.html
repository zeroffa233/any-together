<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMad Method 头脑风暴技法编排</title>
<script>
/* set the theme before first paint so there's no light-mode flash */
(function(){ try {
  var t = localStorage.getItem('bmad-theme');
  if (!t) { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', t);
} catch(e){} })();
</script>
<style>
  :root {
    --bg:#f6f7fb; --surface:#fff; --ink:#1c1e2b; --muted:#6b7080;
    --accent:#5b4bdc; --accent-ink:#5b4bdc; --warn:#c0561f;
    --line:#e6e8f0; --control:#eef0f7; --control2:#f1f2f8; --raised:#fff;
    --cnt:#b9bdce; --foot:#aeb2c4; --shadow:rgba(20,20,50,.06);
  }
  :root[data-theme="dark"] {
    --bg:#0f1117; --surface:#171a23; --ink:#e7e9f2; --muted:#9aa0b4;
    --accent:#6d5cf0; --accent-ink:#a99bff; --warn:#e08a4a;
    --line:#2a2f3e; --control:#222634; --control2:#1d212d; --raised:#2c3242;
    --cnt:#5a6076; --foot:#5a6076; --shadow:rgba(0,0,0,.45);
  }
  /* lift the category hue toward white on dark surfaces so deep hues stay legible */
  :root[data-theme="dark"] section > h2 { color:color-mix(in srgb, var(--c) 62%, #fff); }
  :root[data-theme="dark"] .tech .ico { color:color-mix(in srgb, var(--c) 68%, #fff); }
  :root[data-theme="dark"] label.tech:has(input:checked) { border-color:color-mix(in srgb, var(--c) 60%, #fff); }
  .titlerow { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .themebtn { flex:none; width:36px; height:36px; border-radius:9px; background:var(--control); color:var(--ink); font-size:17px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .themebtn:hover { background:var(--raised); }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--surface); padding:20px 0 12px; border-bottom:1px solid var(--line); box-shadow:0 2px 12px var(--shadow); }
  .hwrap { max-width:1120px; margin:0 auto; padding:0 24px; }  /* align header content with the card column on wide screens */
  h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.02em; }
  .sub { margin:0 0 12px; color:var(--muted); font-size:14px; max-width:74ch; }
  button { font:inherit; border:0; border-radius:8px; cursor:pointer; }
  .composer { display:flex; flex-direction:column; gap:9px; margin:6px 0 12px; }
  .grp { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .glabel { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); min-width:74px; }
  .modes { display:inline-flex; background:var(--control); border-radius:9px; padding:3px; gap:2px; }
  .mode { padding:7px 13px; font-size:14px; font-weight:600; color:var(--muted); background:transparent; }
  .mode.on { background:var(--raised); color:var(--accent-ink); box-shadow:0 1px 3px var(--shadow); }
  .modehint { flex:1 1 240px; min-width:0; font-size:13px; color:var(--muted); font-style:italic; }
  .pill { font-size:13px; color:var(--muted); background:var(--control); padding:6px 12px; border-radius:20px; }
  .pill b { color:var(--accent-ink); }
  .step { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); background:var(--control2); padding:4px 6px 4px 12px; border-radius:20px; }
  .step b { min-width:12px; text-align:center; font-size:14px; color:var(--ink); }
  .step button { width:24px; height:24px; border-radius:50%; background:var(--raised); color:var(--muted); font-size:17px; line-height:22px; text-align:center; box-shadow:0 1px 2px var(--shadow); }
  .step button:hover { color:var(--accent-ink); }
  .total { font-size:12px; color:var(--muted); }
  .total.warn { color:var(--warn); font-weight:600; }
  .bar { display:flex; gap:10px 14px; align-items:center; flex-wrap:wrap; }
  #copy { margin-left:auto; padding:9px 22px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; }
  #copy:hover { filter:brightness(1.07); }
  .chips { flex:1 1 320px; min-width:0; display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:12px; padding:4px 11px; border-radius:16px; border:0; color:#fff; background:var(--cc); font-weight:600; cursor:pointer; }
  .chip:hover { filter:brightness(1.08); }
  .banner { max-height:0; overflow:hidden; transition:max-height .25s ease, padding .22s ease, margin .22s ease; background:linear-gradient(90deg,var(--accent),#8275f2); color:#fff; border-radius:10px; font-weight:700; text-align:center; padding:0 14px; }
  .banner.show { max-height:64px; padding:13px 14px; margin-top:10px; }
  .banner.fail { background:linear-gradient(90deg,var(--warn),#e0894a); }
  main { padding:18px 24px 60px; max-width:1120px; margin:0 auto; }
  section { margin:0 0 26px; }
  section > h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--c); margin:0 0 10px; border-bottom:1px solid color-mix(in srgb, var(--c) 24%, var(--line)); padding-bottom:6px; }
  section > h2 .cnt { color:color-mix(in srgb, var(--c) 45%, var(--cnt)); margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:10px; }
  label.tech { display:flex; gap:12px; align-items:flex-start; background:color-mix(in srgb, var(--c) 5%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 18%, var(--line)); border-radius:10px; padding:11px 13px; cursor:pointer; transition:border-color .12s, box-shadow .12s, background .12s; }
  label.tech:hover { border-color:color-mix(in srgb, var(--c) 45%, var(--surface)); }
  label.tech input { margin-top:2px; width:17px; height:17px; accent-color:var(--c); flex:none; }
  label.tech:has(input:checked) { border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, var(--surface)); box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
  .tech .ic2 { display:flex; gap:5px; flex:none; }
  .tech .ico { width:40px; height:40px; flex:none; color:var(--c); }
  .tech .n { font-weight:600; display:block; }
  .tech .d { color:var(--muted); font-size:13.5px; display:block; margin-top:2px; }
  .tech .gf { color:var(--accent-ink); font-size:11px; display:block; margin-top:5px; opacity:.85; }
  .grouphdr { margin:30px 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--c); opacity:.92; border-bottom:1px solid color-mix(in srgb, var(--c) 22%, var(--line)); padding-bottom:7px; }
  main > .grouphdr:first-child { margin-top:2px; }
  :root[data-theme="dark"] .grouphdr { color:color-mix(in srgb, var(--c) 62%, #fff); }
  .goals { display:flex; gap:7px; flex-wrap:wrap; }
  .goal { font-size:12px; padding:5px 12px; border-radius:16px; background:var(--control); color:var(--muted); font-weight:600; }
  .goal:hover { color:var(--ink); }
  .goal.on { background:var(--accent); color:#fff; }
  label.tech.invent { border-style:dashed; background:transparent; }
  label.tech.invent:hover { border-color:var(--c); }
  label.tech.invent .n { color:var(--c); }
  label.tech.hidden { display:none; }
  footer { text-align:center; color:var(--foot); font-size:12px; padding:24px; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
  <div class="titlerow">
    <h1>BMad Method 头脑风暴技法编排</h1>
    <button id="theme" class="themebtn" type="button" aria-label="切换深色模式" title="切换深色模式"></button>
  </div>
  <p class="sub">编排你这次的 session,点<strong>复制指令</strong>,然后粘回聊天里开始。 共 108 个技法,13 个分类。</p>

  <div class="composer">
    <div class="grp">
      <span class="glabel">引导模式</span>
      <div class="modes" id="modes">
        <button type="button" class="mode on" data-mode="Facilitator">纯引导 Facilitator</button>
        <button type="button" class="mode" data-mode="Creative Partner">创意搭档 Creative Partner</button>
        <button type="button" class="mode" data-mode="Ideate for me">我来跑 Ideate for me</button>
      </div>
      <span class="modehint" id="modehint"></span>
    </div>
    <div class="grp">
      <span class="glabel">技法</span>
      <span class="pill">已选 <b id="pickN">0</b></span>
      <span class="step">随机 <button type="button" data-step="rand" data-d="-1">&minus;</button><b id="randN">0</b><button type="button" data-step="rand" data-d="1">+</button></span>
      <span class="step">发明 <button type="button" data-step="inv" data-d="-1">&minus;</button><b id="invN">0</b><button type="button" data-step="inv" data-d="1">+</button></span>
      <span class="step">AI 挑选 <button type="button" data-step="ai" data-d="-1">&minus;</button><b id="aiN">0</b><button type="button" data-step="ai" data-d="1">+</button></span>
      <span class="total" id="total">共 0 个 &middot; 3&ndash;4 个最合适</span>
      <button id="copy" type="button">复制指令</button>
    </div>
  </div>

  <div class="bar"><span class="glabel">适合场景</span><div class="goals" id="goals"><button type="button" class="goal" data-goal="feature">做功能</button><button type="button" class="goal" data-goal="novel">全新概念</button><button type="button" class="goal" data-goal="strategy">战略</button><button type="button" class="goal" data-goal="planning">规划</button><button type="button" class="goal" data-goal="diagnosis">诊断问题</button><button type="button" class="goal" data-goal="personal">个人 / 生活</button><button type="button" class="goal" data-goal="unstuck">破除卡壳</button></div></div>
  <div class="bar">
    <span class="glabel">跳转到</span>
    <div class="chips" id="chips"><button type="button" class="chip" data-cat="Proven &amp; Professional" style="--cc:#3d4f73">经典 · 久经验证</button><button type="button" class="chip" data-cat="Structured" style="--cc:#3b6ea5">结构化</button><button type="button" class="chip" data-cat="Deep" style="--cc:#4658c9">深度挖掘</button><button type="button" class="chip" data-cat="Creative" style="--cc:#6d5cf0">创造性</button><button type="button" class="chip" data-cat="Biomimetic" style="--cc:#1f9d6b">仿生</button><button type="button" class="chip" data-cat="Cultural" style="--cc:#c75b39">文化</button><button type="button" class="chip" data-cat="Speculative Future" style="--cc:#0fb5c9">未来推演</button><button type="button" class="chip" data-cat="Quantum" style="--cc:#2b86d9">量子隐喻</button><button type="button" class="chip" data-cat="Wild" style="--cc:#e2562f">狂野</button><button type="button" class="chip" data-cat="Absurdist" style="--cc:#e0529c">荒诞</button><button type="button" class="chip" data-cat="Theatrical" style="--cc:#cf4d6f">戏剧扮演</button><button type="button" class="chip" data-cat="Constraint" style="--cc:#d9882b">极限约束</button><button type="button" class="chip" data-cat="Introspective Delight" style="--cc:#b15ad6">内省</button><button type="button" class="chip" data-cat="Collaborative" style="--cc:#15a3a3">协作</button></div>
  </div>

  <div class="banner" id="banner">&#10003; 已复制!粘回聊天里就能开始。</div>
  </div>
</header>
<main>
<section data-cat="Proven &amp; Professional" style="--c:#3d4f73"><h2>经典 · 久经验证<span class="cnt">29</span></h2><div class="grid"><label class="tech" style="--c:#15a3a3"><input type="checkbox" data-name="Yes And Building" data-cat="Collaborative" data-desc="Never negate; each person opens with &quot;Yes, and...&quot; and adds to the last idea, stacking a chain of accepted additions" data-good="novel|unstuck|planning" data-prov="classic" data-lead="1"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="8" y="27" width="12" height="8" rx="1.5" fill-opacity=".8"/><rect x="14" y="19" width="12" height="8" rx="1.5" fill-opacity=".5"/><rect x="20" y="11" width="12" height="8" rx="1.5"/></g></svg></span><span><span class="n">是的,而且</span><span class="d">永不否定;每个人都以「是的,而且……」开口,在上一个想法上继续叠加,堆出一条只进不退的接龙</span><span class="gf">适合: 全新概念 · 破除卡壳 · 规划</span></span></label><label class="tech" style="--c:#15a3a3"><input type="checkbox" data-name="Brain Writing Round Robin" data-cat="Collaborative" data-desc="Everyone writes ideas silently, then passes their sheet; you build on whatever lands in front of you, round after round" data-good="novel|feature" data-prov="classic" data-lead="1"><span class="ic2"><svg class="ico" viewBox= oke-width="1.5" stroke-opacity="0.4"/><circle cx="22" cy="22" r="9" stroke-width="1.7" stroke-opacity="0.7"/><circle cx="22" cy="22" r="5" stroke-width="1.9"/></g><circle cx="22" cy="22" r="2.4" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22 H33"/><path d="M33 22 L36 18.5 M33 22 L36 25.5"/><path d="M14 22 L18 15 M14 22 L18 29 M23 22 L27 15 M23 22 L27 29"/></g><circle cx="9" cy="22" r="1.9" fill="currentColor"/></svg></span><span><span class="n">鱼骨图</span><span class="d">把问题的主脊分成几类原因(人、流程、工具、环境),再从每根骨头上挖出促成因素</span><span class="gf">适合: 诊断问题</span></span></label><label class="tech" style="--c:#4658c9"><input type="checkbox" data-name="Build on What Works" data-cat="Deep" data-desc="Name what&#x27;s already succeeding and why, then ideate how to amplify and extend it instead of fixing what&#x27;s broken" data-good="personal|strategy" data-prov="classic" data-lead="1"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor"><circle cx="22" cy="22" r="13" stroke-width="1.5" stroke-opacity="0.4"/><circle cx="22" cy="22" r="9" stroke-width="1.7" stroke-opacity="0.7"/><circle cx="22" cy="22" r="5" stroke-width="1.9"/></g><circle cx="22" cy="22" r="2.4" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="11" y="24" width="6" height="9" rx="1"/><rect x="19" y="19" width="6" height="14" rx="1"/><rect x="27" y="13" width="6" height="20" rx="1"/></g><path d="M11 19 L18 13 L24 16 L33 8" fill= <section data-cat="Structured" style="--c:#3b6ea5"><h2>结构化<span class="cnt">15</span></h2><div class="grid"><label class="tech"><input type="checkbox" data-name="SCAMPER Method" data-cat="Structured" data-desc="Run your idea through seven lenses: Substitute, Combine, Adapt, Modify, Put-to-other-use, Eliminate, Reverse" data-good="feature|novel" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="11" y="11" width="9.5" height="9.5" rx="2"/><rect x="23.5" y="11" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="11" y="23.5" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="23.5" y="23.5" width="9.5" height="9.5" rx="2"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><circle cx="22" cy="22" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M22 9 V13.5 M22 30.5 V35 M9 22 H13.5 M30.5 22 H35 M12.8 12.8 L16 16 M28 28 L31.2 31.2 M31.2 12.8 L28 16 M16 28 L12.8 31.2"/></g></svg></span><span><span class="n">SCAMPER 法</span><span class="d">把想法过一遍七重镜头:替代、组合、改造、修改、他用、消除、反转</span><span class="gf">适合: 做功能 · 全新概念</span></span></label><label class="tech"><input type="checkbox" data-name="Six Thinking Hats" data-cat="Structured" data-desc="Examine the problem six ways one at a time: facts, feelings, benefits, risks, new ideas, process" data-good="strategy|diagnosis|planning|personal" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="11" y="11" width="9.5" height="9.5" rx="2"/><rect x="23.5" y="11" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="11" y="23.5" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="23.5" y="23.5" width="9.5" height="9.5" rx="2"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M14 26 q8 -5 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 26 q-6 1 -8 3 q13 4 26 0 q-2 -2 -8 -3" fill="currentColor" fill-opacity=".22"/><path d="M17 26 c-1 -8 11 -8 10 0" fill="currentColor" fill-opacity=".5"/></svg></span><span><span class="n">六顶思考帽</span><span class="d">一次一顶,从六个方向审视问题:事实、感受、收益、风险、新点子、流程</span><span class="gf">适合: 战略 · 诊断问题 · 规划 · 个人 / 生活</span></span></label><label class="tech"><input type="checkbox" data-name="Decision Tree Mapping" data-cat="Structured" data-desc="Chart every choice point and the paths it forks into, following each branch to its outcome and risk" data-good="planning|strategy|diagnosis" data-prov="signature"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="11" y="11" width="9.5" height="9.5" rx="2"/><rect x="23.5" y="11" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="11" y="23.5" width="9.5" height="9.5" rx="2" fill-opacity="0.25"/><rect x="23.5" y="23.5" width="9.5" height="9.5" rx="2"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="12" r="2.6"/><circle cx="14" cy="32" r="2.6"/><circle cx="30" cy="32" r="2.6"/><path d="M22 14.5 L22 20 M22 20 L14 29.4 M22 20 L30 29.4"/></g></svg></sp <h2 class="grouphdr" style="--c:#e2562f">狂野与玩闹</h2>
<section data-cat="Wild" style="--c:#e2562f"><h2>狂野<span class="cnt">7</span></h2><div class="grid"><label class="tech"><input type="checkbox" data-name="Chaos Engineering" data-cat="Wild" data-desc="Deliberately break your idea every way it could fail, then rebuild only the parts that survive the wreckage" data-good="feature|diagnosis|strategy" data-prov="signature"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M24.5 6.5 L 12.5 24 H 19.5 L 17.5 37.5 L 31.5 18.5 H 24 L 24.5 6.5 Z" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9 L25 18 L34 18 L27 24 L30 33 L22 27 L14 33 L17 24 L10 18 L19 18 Z"/></g></svg></span><span><span class="n">混沌工程</span><span class="d">故意用一切可能失败的方式击碎你的想法,然后只重建那些从残骸里活下来的部分</span><span class="gf">适合: 做功能 · 诊断问题 · 战略</span></span></label><label class="tech"><input type="checkbox" data-name="Guerrilla Gardening Ideas" data-cat="Wild" data-desc="Plant your solution in the least expected place and let it grow underground until it surprises everyone" data-good="strategy|unstuck" data-prov="playful"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M24.5 6.5 L 12.5 24 H 19.5 L 17.5 37.5 L 31.5 18.5 H 24 L 24.5 6.5 Z" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 33 V21"/><path d="M22 22 c-7 0 -9 -6 -9 -9 c6 0 9 3 9 9 z"/><path d="M22 24 c6 0 8 -4 8 -7 c-5 0 -8 2 -8 7 z"/></g></svg></span><span><span class="n">游击种植</span><span class="d">把你的解法种在最出人意料的地方,让它在地下悄悄长,直到有一天惊到所有人</span><span class="gf">适合: 战略 · 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Pirate Code Brainstorm" data-cat="Wild" data-desc="Steal the best bits from anywhere, remix without asking permission, grab what works and run" data-good="novel|unstuck" data-prov="playful"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M24.5 6.5 L 12.5 24 H 19.5 L 17.5 37.5 L 31.5 18.5 H 24 L 24.5 6.5 Z" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M22 10 c-7 0 -11 5 -11 11 c0 4 2 6 4 7 v4 h3 v-2 h2 v2 h4 v-2 h2 v2 h3 v-4 c2 -1 4 -3 4 -7 c0 -6 -4 -11 -11 -11 z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><g fill="currentColor"><circle cx="17.5" cy="21" r="2.2"/><circle cx="26.5" cy="21" r="2.2"/></g></svg></span><span><span class="n">海盗法典</span><span class="d">从任何地方偷最好的部分,不打招呼直接混音,抓到能用的就跑</span><span class="gf">适合: 全新概念 · 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Zombie Apocalypse Planning" data-cat="Wild" data-desc="Society just collapsed — strip your idea to only what survives with no power, no rules, no backup" data-good="feature|strategy|unstuck" data-prov="playful"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M24.5 6.5 L 12.5 24 H 19.5 L 17.5 37.5 L 31.5 18.5 H 24 L 24.5 6.5 Z" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><circle cx="22" cy="22" r="4" fill="none" stroke="currentColor" stroke-width="2"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10 a12 12 0 0 1 6 3.5 M32 16 a12 12 0 0 1 0 12 M28 33.5 a12 12 0 0 1 -12 0 M12 28 a12 12 0 0 1 0 -12 M16 10.5 a12 12 0 0 1 6 -0.5" stroke-dasharray="0.1 5.5"/></g><g fill="currentColor"><circle cx="22" cy="11" r="2"/><circle cx="11" cy="22" r="2"/><circle cx="33" cy="22" r="2"/></g></svg></span><span><span class="n">末日废土规划</span><span class="d">社会刚刚崩塌——把你的想法剥到只剩没电、没规则、没有备份也能活下来的那部分</span><span class="gf">适合: 做功能 · 战略 · 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Drunk History Retelling" data-cat="Wild" data-desc="Explain it like you&#x27;re three drinks in: no filter, no jargon, just the raw stupid-simple truth" data-good="unstuck|diagnosis" data-prov="playful"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M24.5 6.5 L 12.5 24 H 19.5 L 17.5 37.5 L 31.5 18.5 H 24 L 24.5 6.5 Z" fill="currentColor"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 12 H31 L25 23 V31 H19 V23 Z"/><path d="M19 31 H25" /></g><circle cx="29" cy="14" r="1.4" fill="currentColor"/></svg></span><span><span class="n">醉酒重述</span><span class="d">像喝了三杯之后那样讲它:没有滤镜、没有黑话,只有那个蠢到极致的大白话真相</span><span class="gf">适合: 破除卡壳 · 诊断问题</span></span></label><label class="tech"><input type="checkbox" data-name="Anti-Solution" data-cat="Wild" data-desc="Brainstorm how to make the problem spectacularly worse, then i x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2"><path d="M10 16 h24" stroke-opacity=".4"/><path d="M10 22 h24" stroke-opacity=".6"/></g><path d="M22 24 L16 30 L22 36 L28 30 Z" fill="currentColor"/></svg></span><span><span class="n">价值观考古</span><span class="d">不停问「我为什么在乎?」直到触到基岩:那个在暗中操纵选择的、不可让渡的价值</span><span class="gf">适合: 个人 / 生活 · 战略</span></span></label><label class="tech"><input type="checkbox" data-name="Future Self Interview" data-cat="Introspective Delight" data-desc="Interview your wise 80-year-old self about this problem and write down the advice they give you" data-good="personal" data-prov="signature"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><circle cx="22" cy="13.5" r="4" fill="currentColor"/><path d="M10.5 31 C 12.5 23, 31.5 23, 33.5 31 Z" fill="currentColor" fill-opacity="0.22"/><path d="M10.5 31 C 12.5 23, 31.5 23, 33.5 31" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M13.5 30 C 16 26.5, 20 25.5, 22 25.5 C 24 25.5, 28 26.5, 30.5 30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-opacity="0.6"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10 H30 L24 22 L30 34 H14 L20 22 Z"/></g><path d="M18 14 H26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><span class="n">未来自我访谈</span><span class="d">采访 80 岁那个睿智的自己对这个问题的看法,把他给你的建议记下来</span><span class="gf">适合: 个人 / 生活</span></span></label><label class="tech"><input type="checkbox" data-name="Body Wisdom Dialogue" data-cat="Introspective Delight" data-desc="Scan for the tension, fl oke-width="1.7" fill="none"/><path d="M13.5 30 C 16 26.5, 20 25.5, 22 25.5 C 24 25.5, 28 26.5, 30.5 30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-opacity="0.6"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><rect x="10" y="14" width="24" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 23 L19 27 L28 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><span class="n">授予许可</span><span class="d">给自己写一张明确的许可条,允许自己想那个被禁止的、不可能的念头——然后大声把它想出来</span><span class="gf">适合: 个人 / 生活 · 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Secret Wish Confession" data-cat="Introspective Delight" data-desc="Whisper the embarrassing thing you secretly want here but won&#x27;t admit, then build the idea honoring it" data-good="personal" data-prov="signature"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><circle cx="22" cy="13.5" r="4" fill="currentColor"/><path d="M10.5 31 C 12.5 23, 31.5 23, 33.5 31 Z" fill="currentColor" fill-opacity="0.22"/><path d="M10.5 31 C 12.5 23, 31.5 23, 33.5 31" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M13.5 30 C 16 26.5, 20 25.5, 22 25.5 C 24 25.5, 28 26.5, 30.5 30" stroke="currentColor" stroke-width="1.5" fill="none" stroke-opacity="0.6"/></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><rect x="13" y="20" width="18" height="14" rx="2.5" fill="currentColor" fill-opacity=".22"/><rect x="13" y="20" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 20 v-3 a5. <section data-cat="Collaborative" style="--c:#15a3a3"><h2>协作<span class="cnt">8</span></h2><div class="grid"><label class="tech"><input type="checkbox" data-name="Yes And Building" data-cat="Collaborative" data-desc="Never negate; each person opens with &quot;Yes, and...&quot; and adds to the last idea, stacking a chain of accepted additions" data-good="novel|unstuck|planning" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="currentColor"><rect x="8" y="27" width="12" height="8" rx="1.5" fill-opacity=".8"/><rect x="14" y="19" width="12" height="8" rx="1.5" fill-opacity=".5"/><rect x="20" y="11" width="12" height="8" rx="1.5"/></g></svg></span><span><span class="n">是的,而且</span><span class="d">永不否定;每个人都以「是的,而且……」开口,在上一个想法上继续叠加,堆出一条只进不退的接龙</span><span class="gf">适合: 全新概念 · 破除卡壳 · 规划</span></span></label><label class="tech"><input type="checkbox" data-name="Brain Writing Round Robin" data-cat="Collaborative" data-desc="Everyone writes ideas silently, then passes their sheet; you build on whatever lands in front of you, round after round" data-good="novel|feature" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M31 16 A10 10 0 1 0 32.5 22"/><path d="M31 10 L31.5 16.3 L25 16.5"/></g></svg></span><span><span class="n">轮转笔写</span><span class="d">所有人各自默写想法,然后把纸传给下一个人;你只能在传到面前的那张上继续写,一轮接一轮</span><span class="gf">适合: 全新概念 · 做功能</span></span></label><label class="tech"><input type="checkbox" data-name="Random Stimulation" data-cat="Collaborative" data-desc="Pull a random word or image and force a link to the problem: &quot;how does THIS spark a solution?&quot;" data-good="unstuck|novel" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><rect x="11" y="11" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><g fill="currentColor"><circle cx="17" cy="17" r="1.8"/><circle cx="27" cy="17" r="1.8"/><circle cx="22" cy="22" r="1.8"/><circle cx="17" cy="27" r="1.8"/><circle cx="27" cy="27" r="1.8"/></g></svg></span><span><span class="n">随机刺激</span><span class="d">抽一个随机的词或图,强行和问题挂钩:「这玩意儿能怎么点醒这个问题?」</span><span class="gf">适合: 破除卡壳 · 全新概念</span></span></label><label class="tech"><input type="checkbox" data-name="Role Playing" data-cat="Collaborative" data-desc="Each person speaks as a different stakeholder, voicing what that role wants, fears, and would demand of the idea" data-good="strategy|personal|feature" data-prov="classic"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><rect x="11" y="9" width="22" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="19" r="4" fill="currentColor"/><path d="M15.5 30 c2 -4.5 11 -4.5 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><span class="n">角色扮演</span><span class="d">每个人代言一个不同的利益相关者,说出那个角色想要什么、怕什么、会对这个想法提什么要求</span><span class="gf">适合: 战略 · 个人 / 生活 · 做功能 "0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M11 31 Q22 8 33 31" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 3.5" stroke-linecap="round"/><circle cx="22" cy="12.5" r="4.2" fill="currentColor"/></svg></span><span><span class="n">想法烫手山芋</span><span class="d">一个想法在圈里传,每个接住的人必须在 10 秒内把它变异掉再传出去,不许重复</span><span class="gf">适合: 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Steal And Upgrade" data-cat="Collaborative" data-desc="Pick a neighbor&#x27;s idea you envy, claim it out loud, then make it visibly better before handing it back improved" data-good="novel|unstuck" data-prov="signature"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 33 V14"/><path d="M13 21 L20 14 L27 21"/></g><path d="M30 27 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1 z" fill="currentColor"/></svg></span><span><span class="n">偷来再升级</span><span class="d">挑一个你眼馋的邻座想法,大声认领,然后当众把它改得更好再还回去</span><span class="gf">适合: 全新概念 · 破除卡壳</span></span></label><label class="tech"><input type="checkbox" data-name="Fold The Paper" data-cat="Collaborative" data-desc="Each person adds one line to a hidden drawing or sentence, sees only the previous fragment, then unfold the surreal whole" data-good="unstuck|novel" data-prov="playful"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><path d="M13 16 L21 12 V28 L13 32 Z" fill="currentColor" fill-opacity=".22"/><path d="M21 12 L29 16 V32 L21 28 Z" fill="currentColor" fill-opacity=".45"/><path d="M13 16 L21 12 L29 16 M21 12 V28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span><span class="n">折纸接龙</span><span class="d">每人只在一幅被遮住的画或一句话上添一笔,只能看到上一段残片,最后展开那个超现实的整体</span><span class="gf">适合: 破除卡壳 · 全新概念</span></span></label><label class="tech invent"><input type="checkbox" data-invent="Collaborative"><span class="ic2"><svg class="ico" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="41" height="41" rx="12" fill="currentColor" fill-opacity="0.12"/><g stroke="currentColor" stroke-width="1.8"><line x1="14" y1="16" x2="30" y2="16"/><line x1="14" y1="16" x2="22" y2="30"/><line x1="30" y1="16" x2="22" y2="30"/></g><g fill="currentColor" fill-opacity="0.22"><circle cx="14" cy="16" r="4.6"/><circle cx="30" cy="16" r="4.6"/><circle cx="22" cy="30" r="4.6"/></g><g fill="currentColor"><circle cx="14" cy="16" r="2.4"/><circle cx="30" cy="16" r="2.4"/><circle cx="22" cy="30" r="2.4"/></g></svg></span><span><span class="n">✨ 即兴发明一个「协作」技法</span><span class="d">当场造一个全新的技法,秉持「协作」的精神</span></span></label></div></section>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var all = Array.prototype.slice;
  var boxes = all.call(document.querySelectorAll('input[type=checkbox]'));
  var techBoxes = boxes.filter(function(b){ return b.dataset.name; });      // real technique cards
  var inventBoxes = boxes.filter(function(b){ return b.dataset.invent; });  // per-category "invent in the spirit of" cards
  var header = document.querySelector('header');
  var sections = all.call(document.querySelectorAll('section'));
  var state = { mode: 'Facilitator', rand: 0, inv: 0, ai: 0 };
  var MODE_HINTS = {
    'Facilitator': '把你的想法逼出来的装置 —— 我只提问、只施压,一个想法都不会给你。',
    'Creative Partner': '我们一起对打 —— 我一边引导一边也扔想法,每条都会标记是你的还是我的。',
    'Ideate for me': '我自己把整场跑完,然后把结果给你看,再问你要不要继续。'
  };
  function setHint(){ $('modehint').textContent = MODE_HINTS[state.mode] || ''; }

  var themeBtn = $('theme');
  function setThemeIcon(){ themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀' : '☾'; }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('bmad-theme', next); } catch(e){}
    setThemeIcon();
  });

  all.call(document.querySelectorAll('.mode')).forEach(function(b){
    b.addEventListener('click', function(){
      all.call(document.querySelectorAll('.mode')).forEach(function(m){ m.classList.remove('on'); });
      b.classList.add('on');
      state.mode = b.dataset.mode;
      setHint();
    });
  });

  all.call(document.querySelectorAll('[data-step]')).forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.dataset.step, d = parseInt(btn.dataset.d, 10);
      state[k] = Math.max(0, state[k] + d);
      update();
    });
  });

  // Category chips are jump-nav: click one to smooth-scroll its section into view,
  // offsetting by the sticky header's height so the heading isn't hidden beneath it.
  all.call(document.querySelectorAll('.chip')).forEach(function(chip){
    chip.addEventListener('click', function(){
      var sec = null;
      for (var i = 0; i < sections.length; i++){ if (sections[i].dataset.cat === chip.dataset.cat){ sec = sections[i]; break; } }
      if (!sec){ return; }
      var top = sec.getBoundingClientRect().top + window.pageYOffset - header.offsetHeight - 8;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });

  boxes.forEach(function(b){ b.addEventListener('change', update); });

  // A `classic` technique appears twice (lead "Proven & Professional" group + its home
  // category), so de-dupe checked picks by name; the lead copy carries data-lead.
  function checkedTech(){
    var seen = {}, out = [];
    techBoxes.forEach(function(b){
      if (!b.checked || seen[b.dataset.name]) { return; }
      seen[b.dataset.name] = 1;
      out.push(b);
    });
    return out;
  }
  function checkedInvent(){ return inventBoxes.filter(function(b){ return b.checked; }); }

  function update(){
    $('pickN').textContent = checkedTech().length;
    $('randN').textContent = state.rand;
    $('invN').textContent = state.inv;
    $('aiN').textContent = state.ai;
    var total = checkedTech().length + state.rand + state.inv + checkedInvent().length + state.ai;
    var t = $('total');
    t.textContent = '共 ' + total + ' 个 · 3–4 个最合适';
    t.classList.toggle('warn', total > 5);
  }

  // "Great for" goal filter: clicking a goal narrows visible cards to those tagged with it.
  var goalBtns = all.call(document.querySelectorAll('.goal'));
  function activeGoals(){ return goalBtns.filter(function(b){ return b.classList.contains('on'); }).map(function(b){ return b.dataset.goal; }); }
  function applyFilter(){
    var act = activeGoals();
    all.call(document.querySelectorAll('label.tech')).forEach(function(lab){
      var inp = lab.querySelector('input');
      if (inp.dataset.invent){ return; }  // invent cards aren't goal-tagged — always visible
      var good = (inp.dataset.good || '').split('|');
      var show = !act.length || act.some(function(g){ return good.indexOf(g) >= 0; });
      lab.classList.toggle('hidden', !show);
    });
  }
  goalBtns.forEach(function(b){ b.addEventListener('click', function(){ b.classList.toggle('on'); applyFilter(); }); });

  function randomPool(){
    var picked = {};
    checkedTech().forEach(function(b){ picked[b.dataset.name] = 1; });
    // draw from unchecked, non-lead copies, skipping anything already picked
    return techBoxes.filter(function(b){ return !b.checked && !b.dataset.lead && !picked[b.dataset.name]; });
  }

  function sample(arr, n){
    var a = arr.slice(), out = [];
    while (out.length < n && a.length){ out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]); }
    return out;
  }

  function compose(){
    var picks = checkedTech().map(function(b){ return { n: b.dataset.name, c: b.dataset.cat, d: b.dataset.desc, r: false }; });
    var rnd = sample(randomPool(), state.rand).map(function(b){ return { n: b.dataset.name, c: b.dataset.cat, d: b.dataset.desc, r: true }; });
    var techs = picks.concat(rnd);
    var L = ["Let's run my brainstorming session.", "", 'Facilitation mode: ' + state.mode + '.'];
    if (techs.length){
      L.push("", 'Techniques to use:');
      techs.forEach(function(t, i){
        L.push((i + 1) + '.' + (t.r ? ' (random pick)' : '') + ' ' + t.n + '  ·  ' + t.c);
        L.push('   ' + t.d);
      });
    }
    var extra = [];
    if (state.inv > 0){ extra.push('invent ' + state.inv + ' brand-new technique' + (state.inv > 1 ? 's' : '') + ' on the fly'); }
    checkedInvent().forEach(function(b){ extra.push('invent 1 new technique in the spirit of ' + b.dataset.invent); });
    if (state.ai > 0){ extra.push('you choose ' + state.ai + ' more technique' + (state.ai > 1 ? 's' : '') + ' that fit my goal'); }
    if (extra.length){ L.push("", 'Then: ' + extra.join('; and ') + '.'); }
    if (!techs.length && !extra.length){
      L.push("", state.mode === 'Ideate for me'
        ? 'Run the whole session yourself — pick the techniques, generate the ideas, then show me the result.'
        : 'Help me choose 3–4 techniques to start.');
    }
    return L.join('\n');
  }

  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function flash(ok, text){
    var b = $('banner');
    b.classList.toggle('fail', !ok);
    b.innerHTML = ok
      ? '✓ 已复制!粘回聊天里就能开始。'
      : '⚠ 读不到剪贴板 —— 请手动复制框里的文字,再粘回聊天里。';
    b.classList.add('show');
    setTimeout(function(){ b.classList.remove('show'); }, 4500);
    // Last resort on a hard failure: a prefilled, selectable prompt so the text is never lost.
    if (!ok){ window.prompt('复制这段,然后粘回聊天里:', text); }
  }

  $('copy').addEventListener('click', function(){
    var text = compose();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ flash(true, text); },
        function(){ flash(fallbackCopy(text), text); }
      );
    } else { flash(fallbackCopy(text), text); }
  });

  setHint();
  setThemeIcon();
  update();
})();
</script>
</body>
</html>
